name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GAS_URL from Secret
        run: |
          sed -i 's|__GAS_URL__|${{ secrets.GAS_URL }}|g' index.html
          sed -i 's|__GAS_URL__|${{ secrets.GAS_URL }}|g' admin.html
          echo "✅ GAS_URL injected successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
